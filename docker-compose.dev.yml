services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: max_events
      POSTGRES_PASSWORD: max_events
      POSTGRES_DB: max_events
    ports:
      - "5443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6391:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
